services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: rubber_duck_store
      MYSQL_USER: duck
      MYSQL_PASSWORD: duck
      MYSQL_ROOT_PASSWORD: duckroot
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pduckroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
